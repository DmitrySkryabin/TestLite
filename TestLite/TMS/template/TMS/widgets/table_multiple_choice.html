{% with id=widget.attrs.id %}
<table {% if id %} id="{{ id }}" {% endif %} class="table table-sm table-responsive {% if widget.attrs.class %}{{ widget.attrs.class }}{% endif %}">
  <thead class="table-light">
    <tr>
      <td><input type="checkbox" onclick="checkAllCheckBoxesFolder(this)" id="checkAllCheckboxesFolder"></td>
      <td>Ключ</td>
      <td>Название</td>
      <td>Версия</td>
      <td>Приоритет</td>
    </tr>
  </thead>
  <tbody>
    {% for testcase in testcases %}
      <tr onclick="checkUncheckCheckboxFolder(this)" class="table-row-clickable">
        <td><input type="checkbox" name="test_cases" value="{{ testcase.pk }}" id="id_test_cases_{{ forloop.counter0 }}" onclick="this.click()" {% if testcase.selected %} checked {% endif %}></td>
        <td>{{ testcase.key }}</td>
        <td>{{ testcase.name }}</td>
        <td>{{ testcase.version }}</td>
        <td><span class="badge {{ testcase.priority|priority_bootstrap_class }}">{{ testcase.get_priority_display }}</span></td>
      </tr>
    {% endfor %}
  </tbody>
</table>
<script>

  let checkedCheckboxesFolder = 0;
  const allCheckBoxesFolder = document.querySelectorAll('input[type=checkbox][name=test_cases]');

  function checkAllCheckBoxesFolder(elem) {
    if (elem.checked == true) {
      allCheckBoxesFolder.forEach((checkbox) => {
        checkbox.checked = true;
      });
    }
    else {
      allCheckBoxesFolder.forEach((checkbox) => {
        checkbox.checked = false;
      });
    }
  };

  function checkUncheckCheckboxFolder(elem) {
    const checkbox = elem.querySelector('input[type=checkbox]');
    checkbox.click();
  };

  allCheckBoxesFolder.forEach(function(item) {
    item.addEventListener('change', function(event) {
      if (event.target.checked == true) {
        checkedCheckboxesFolder++;
      }
      else {
        checkedCheckboxesFolder--;
      }
      if (checkedCheckboxesFolder == allCheckBoxesFolder.length) {
        document.getElementById('checkAllCheckboxesFolder').checked = true;
      }
      else {
        document.getElementById('checkAllCheckboxesFolder').checked = false;
      }
    })
  });

</script>
{% endwith %}
